[package]
name = "rust_dns"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "dns-ligase"
path = "src/main.rs"

[dependencies]
# async runtime: essential for high-performance networking
tokio = { version = "1.36", features = ["full"] }
# configuration: simple TOML parsing
toml = "0.8"
# serde: required for toml and general data mapping
serde = { version = "1.0", features = ["derive"] }
# HTTP/TLS: required for fetching blocklists
reqwest = { version = "0.11", default-features = false, features = ["native-tls"] }
# regex: required for blocklist rules and regex matching
regex = "1.10"
# logging: standard facade for journald
log = "0.4"
# env_logger: simple logger to stdout/stderr for journald
env_logger = "0.11"
# serde_json: required for cache persistence
serde_json = "1.0"
