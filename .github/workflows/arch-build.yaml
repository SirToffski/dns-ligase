name: Build Arch package

on:
  workflow_dispatch:        # manual trigger only

# Checkout, build and test only; no job writes to the repository.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    container:
      image: archlinux:base-devel
      options: --privileged   # needed for makepkg's fakeroot

    steps:
      - name: Install deps
        run: |
          pacman -Syu --noconfirm git rust

      - uses: actions/checkout@v4
        with:
          # pkgver uses the commit count, so retain the full selected history.
          fetch-depth: 0

      - name: Create build user
        run: |
          useradd -m builder
          echo "builder ALL=(ALL) NOPASSWD: ALL" >> /etc/sudoers
          chown -R builder:builder .

      - name: Build package
        run: |
          cd PKGBUILD
          sudo -u builder env \
            DNS_LIGASE_SOURCE="git+file://${GITHUB_WORKSPACE}#commit=${GITHUB_SHA}" \
            makepkg -s --check --noconfirm
          test "$(sudo -u builder git -C src/dns-ligase rev-parse HEAD)" = "$GITHUB_SHA"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dns-ligase-pkg
          path: PKGBUILD/*.pkg.tar.zst
          retention-days: 30
          if-no-files-found: error
